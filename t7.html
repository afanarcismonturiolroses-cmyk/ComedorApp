<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de index</title>
<style>
body{font-family:sans-serif;padding:.6rem;font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f3f3;padding:.5rem;font-size:12px}
</style>
</head>
<body>
<h3>Mapa de index.html</h3>
<pre id="out">Cargando…</pre>
<script>
var marks = [
  '<!DOCTYPE', '<html', '</html>', '<head>', '</head>', '<body', '</body>',
  '<script', '</scr' + 'ipt>', '<main id="app">', '</main>',
  'const app = initializeApp', 'function loadRoleAndStart', 'function startApp'
];
fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
  .then(function(r){ return r.text(); })
  .then(function(html){
    var lines = html.split('\n');
    var out = 'Total líneas: ' + lines.length + '\n\n';
    for (var i = 0; i < lines.length; i++) {
      for (var j = 0; j < marks.length; j++) {
        if (lines[i].indexOf(marks[j]) >= 0) {
          out += (i + 1) + ': ' + lines[i].trim().slice(0, 70) + '\n';
          break;
        }
      }
    }
    document.getElementById('out').textContent = out;
  })
  .catch(function(e){ document.getElementById('out').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
