<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico 2</title>
<style>body{font-family:sans-serif;padding:1rem;font-size:16px}li{margin:.5rem 0;word-break:break-word}</style>
</head>
<body>
<h3>Diagnóstico 2</h3>
<ul id="log"></ul>

<script>
var L = document.getElementById('log');
function say(t){ var li = document.createElement('li'); li.textContent = t; L.appendChild(li); }
window.say = say;
say('1 JS normal OK');
say('Navegador: ' + navigator.userAgent);
say('Soporta módulos (noModule): ' + ('noModule' in HTMLScriptElement.prototype));
window.addEventListener('error', function(e){ say('ERROR: ' + e.message); });
try {
  import('data:text/javascript,export default 1').then(
    function(){ say('import() dinámico OK'); },
    function(e){ say('import() dinámico FALLA: ' + e.message); }
  );
} catch (e) { say('import() no soportado: ' + e.message); }
</script>

<script type="module">say('2 Módulo simple OK');</script>

<script type="module" onerror="say('3 FALLA la descarga de Firebase')">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
say('3 firebase-app importado OK');
</script>
</body>
</html>
