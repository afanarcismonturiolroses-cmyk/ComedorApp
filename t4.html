<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final de index</title>
<style>
body{font-family:sans-serif;padding:.6rem;font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f3f3;padding:.5rem;font-size:12px}
</style>
</head>
<body>
<h3>Final de index.html</h3>
<pre id="out">Cargando…</pre>
<script>
fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
  .then(function(r){ return r.text(); })
  .then(function(html){
    var lines = html.split('\n');
    var start = Math.max(0, lines.length - 30);
    var out = 'Total líneas: ' + lines.length + '\n\n';
    for (var i = start; i < lines.length; i++) {
      out += (i + 1) + ': ' + lines[i].slice(0, 160) + '\n';
    }
    document.getElementById('out').textContent = out;
  })
  .catch(function(e){
    document.getElementById('out').textContent = 'Error: ' + e.message;
  });
</script>
</body>
</html>
