<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migración Comedor AFA — IDs estables</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#1e293b;margin:0;padding:20px}
main{max-width:720px;margin:auto}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:1.3rem} h2{font-size:1rem}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin-top:8px}
input{border:1px solid #cbd5e1} button{border:0;background:#059669;color:white;font-weight:700}
button:disabled{opacity:.5}
.warn{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;padding:12px;border-radius:10px}
.err{background:#fff1f2;border:1px solid #fecdd3;padding:12px;border-radius:10px}
pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;max-height:360px;overflow:auto}
.small{font-size:.88rem;color:#64748b}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🔄 Migración Comedor AFA</h1>
<p>Convierte <code>students/curso/alumnoId</code> a <code>students/ALU-0001</code> … <code>students/ALU-0198</code> y conserva el historial de asistencia.</p>
<div class="warn"><strong>IMPORTANTE:</strong> usa esta herramienta una sola vez y únicamente después de haber hecho la copia de seguridad de Firebase.</div>
</div>

<div class="card">
<h2>1. Acceso</h2>
<input id="email" type="email" placeholder="Correo de Firebase">
<input id="pass" type="password" placeholder="Contraseña">
<input id="file" type="file" accept=".json">
<button id="login">Entrar y preparar migración</button>
<p id="status" class="small"></p>
</div>

<div id="preview" class="card" style="display:none">
<h2>2. Comprobación</h2>
<div id="summary"></div>
<div id="details" style="margin-top:12px"></div>
<button id="migrate">Ejecutar migración</button>
</div>

<div id="result" class="card" style="display:none">
<h2>Resultado</h2>
<pre id="log"></pre>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {getDatabase,ref,get,update} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const FIREBASE_CONFIG={
 apiKey:"AIzaSyBFun83wXZP5WF1sTBnoJwX9bEdtueWMbY",
 authDomain:"comedorafa.firebaseapp.com",
 databaseURL:"https://comedorafa-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"comedorafa",
 storageBucket:"comedorafa.firebasestorage.app",
 messagingSenderId:"1068343664940",
 appId:"1:1068343664940:web:b91e68d5bb5fdf16320c89"
};
const app=initializeApp(FIREBASE_CONFIG);
const auth=getAuth(app), db=getDatabase(app);
let official=[], current=null, attendance=null;

const $=id=>document.getElementById(id);
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

function log(x){$("result").style.display="block";$("log").textContent+=x+"\n";}

$("login").onclick=async()=>{
 try{
  $("status").textContent="Leyendo JSON y conectando con Firebase…";
  const f=$("file").files[0];
  if(!f) throw new Error("Selecciona el archivo alumnos-2026-2027-ids-estables.json.");
  official=JSON.parse(await f.text());
  if(!Array.isArray(official)||official.length!==198) throw new Error("El JSON debe contener exactamente 198 alumnos.");
  if(official.some(x=>!/^ALU-\d{4}$/.test(x.id)||!x.nombre||!x.clase)) throw new Error("El JSON no tiene el formato esperado.");
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value);
  const [ss,aa]=await Promise.all([get(ref(db,"students")),get(ref(db,"attendance"))]);
  current=ss.exists()?ss.val():{};
  attendance=aa.exists()?aa.val():{};
  const byName={};
  let oldCount=0;
  for(const [clase,group] of Object.entries(current)){
   for(const [oldId,s] of Object.entries(group||{})){
    oldCount++;
    const key=norm((s.nombre||"")+" "+(s.apellidos||""));
    if(key&&!byName[key]) byName[key]={clase,oldId,s};
   }
  }
  let matched=0,unmatched=0;
  const rows=[];
  for(const o of official){
   const found=current[o.clase]?.[o.id] ? {clase:o.clase,oldId:o.id,s:current[o.clase][o.id]} : byName[norm(o.nombre)];
   if(found) matched++; else unmatched++;
   rows.push({o,found});
  }

  const missing=rows.filter(r=>!r.found);
  const detail=missing.length
    ? `<div class="err"><strong>⚠️ NO EJECUTAR</strong><br><br>Estos alumnos oficiales no han podido vincularse con los registros actuales:<br><br>${missing.map(r=>`<strong>${r.o.id}</strong> — ${r.o.nombre} — ${r.o.clase}`).join("<br>")}<br><br>Necesitamos revisar estos nombres antes de migrar.</div>`
    : `<div class="ok"><strong>✓ Todos los alumnos están vinculados.</strong></div>`;

  $("summary").innerHTML=`<div class="ok"><strong>Listo para revisar</strong><br>Alumnos actuales detectados: ${oldCount}<br>Alumnos oficiales: ${official.length}<br>Coincidencias: ${matched}<br>No encontrados: ${unmatched}<br>Días de asistencia detectados: ${Object.keys(attendance).length}</div>`;
  $("details").innerHTML=detail;
  $("migrate").style.display=missing.length?"none":"block";
  $("preview").style.display="block";
  if(!missing.length) $("migrate").onclick=()=>runMigration(rows);
  $("status").textContent=missing.length?"Hay coincidencias que deben revisarse antes de migrar.":"Puedes ejecutar la migración.";
 }catch(e){
  $("status").innerHTML=`<span style="color:#be123c">Error: ${e.message}</span>`;
 }
};

async function runMigration(rows){
 $("migrate").disabled=true;
 $("status").textContent="Migrando… no cierres esta página.";
 const writes={};
 const oldPaths=new Set();

 for(const {o,found} of rows){
  const existing=found?.s||{};
  const target=`students/${o.id}`;
  writes[target]={...existing,...o,activo:existing.activo!==false,origen:"matricula-2026-2027"};
  if(found) oldPaths.add(`students/${found.clase}/${found.oldId}`);
 }

 let movedAttendance=0;
 for(const [date,byClass] of Object.entries(attendance||{})){
  for(const [clase,group] of Object.entries(byClass||{})){
   for(const [oldId,a] of Object.entries(group||{})){
    const s=current?.[clase]?.[oldId];
    if(!s) continue;
    const key=norm((s.nombre||"")+" "+(s.apellidos||""));
    const match=official.find(o=>norm(o.nombre)===key);
    if(!match) continue;
    writes[`attendance/${date}/${match.id}`]=a;
    writes[`attendance/${date}/${clase}/${oldId}`]=null;
    movedAttendance++;
   }
  }
 }

 for(const p of oldPaths) writes[p]=null;

 writes["config/classes"]=[
  "I3 Infantil","I4 Infantil","I5 Infantil","1r Primària","2n Primària",
  "3r Primària","4t Primària","5è Primària","6è Primària"
 ];

 try{
  await update(ref(db),writes);
  log("MIGRACIÓN COMPLETADA");
  log("Alumnos oficiales: "+official.length);
  log("Registros de asistencia movidos: "+movedAttendance);
  log("Rutas antiguas de alumnos eliminadas: "+oldPaths.size);
  log("La nueva estructura usa students/ALU-0001 … students/ALU-0198.");
  log("NO vuelvas a ejecutar esta herramienta.");
  $("status").innerHTML='<span style="color:#047857"><strong>Hecho.</strong> Ya puedes cerrar esta página.</span>';
 }catch(e){
  log("ERROR: "+e.message);
  $("status").innerHTML='<span style="color:#be123c">La migración ha fallado. No la repitas sin revisar Firebase.</span>';
  $("migrate").disabled=false;
 }
}
</script>
</body>
</html>
