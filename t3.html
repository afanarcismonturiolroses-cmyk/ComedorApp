<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico 3</title>
<style>body{font-family:sans-serif;padding:1rem;font-size:16px}li{margin:.5rem 0;word-break:break-word}</style>
</head>
<body>
<h3>Diagnóstico 3</h3>
<ul id="log"></ul>
<script>
var L = document.getElementById('log');
var current = 0, blocks = [];
function say(t){ var li = document.createElement('li'); li.textContent = t; L.appendChild(li); }

window.addEventListener('error', function(e){
  say('⚠ Bloque ' + current + ': ' + e.message + ' (línea ' + e.lineno + ', col ' + e.colno + ')');
  var src = blocks[current - 1];
  if (src && e.lineno) {
    var ln = src.split('\n')[e.lineno - 1] || '';
    say('   Texto de esa línea: ' + ln.slice(0, 250));
  }
});

function runBlock(src){
  return new Promise(function(res){
    var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    var s = document.createElement('script');
    s.type = 'module';
    s.src = url;
    s.onload = function(){ say('Bloque ' + current + ': se ejecutó'); res(); };
    s.onerror = function(){ say('Bloque ' + current + ': el navegador NO pudo cargarlo'); res(); };
    document.body.appendChild(s);
    setTimeout(res, 4000);
  });
}

say('1 JS normal OK');
fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
  .then(function(r){ return r.text(); })
  .then(async function(html){
    say('index.html: ' + html.length + ' caracteres');
    var re = new RegExp('<scr' + 'ipt type="module">([\\s\\S]*?)<\\/scr' + 'ipt>', 'g');
    var m;
    while ((m = re.exec(html))) blocks.push(m[1]);
    say('Bloques módulo: ' + blocks.length);
    for (var i = 0; i < blocks.length; i++) {
      current = i + 1;
      await runBlock(blocks[i]);
    }
    say('FIN');
  })
  .catch(function(e){ say('Fallo: ' + e.message); });
</script>
</body>
</html>
